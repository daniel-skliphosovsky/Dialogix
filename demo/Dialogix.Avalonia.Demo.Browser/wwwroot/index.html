<!DOCTYPE html>
<html>

<head>
    <title>Dialogix.Avalonia</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366F1">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="favicon.ico" sizes="256x256">
    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>
    <script type='module' src="main#[.{fingerprint}].js"></script>
    <style>
        html, body { height: 100%; }

        #splash {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-content: center;
            justify-items: center;
            gap: 25px;
            background: #0f1115;
            color: #e6e8ee;
            font: 500 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
            opacity: 1;
            transition: opacity .25s ease;
        }

        #splash.gone { opacity: 0; }

        #splash .brand {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #splash .brand svg {
            height: 70px;
            width: auto;
            flex: none;
        }

        #splash .wordmark {
            font-size: 42px;
            font-weight: 650;
            letter-spacing: 0;
            line-height: 1;
        }

        #splash .wordmark em {
            font-style: normal;
            font-size: 1.2em;
            font-weight: 550;
            margin-left: .3em;
            color: #6366F1;
        }

        #splash .subtitle {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0;
            text-transform: uppercase;
            opacity: .45;
        }

        #splash .spinner {
            width: 27px;
            height: 27px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .18);
            border-top-color: #6366F1;
            animation: spin .8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-color-scheme: light) {
            #splash { background: #f6f7fb; color: #12141a; }
            #splash .spinner { border-color: rgba(0, 0, 0, .12); border-top-color: #6366F1; }
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden">
    <div id="out"></div>

    <div id="splash" role="status" aria-live="polite">
        <div class="brand">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="91 73 330 406" aria-hidden="true">
                <g fill="none" stroke="#6366F1" stroke-linejoin="round" stroke-linecap="round">
                    <path d="M110 92 H250 A152 152 0 0 1 250 396 H192 L110 460 Z" stroke-width="38" />
                    <line x1="176" y1="204" x2="316" y2="204" stroke-width="28" />
                    <line x1="206" y1="288" x2="338" y2="288" stroke-width="28" />
                </g>
            </svg>
            <span class="wordmark">ialogix<em>UI</em></span>
        </div>
        <div class="subtitle">Build messenger UI in Avalonia</div>
        <div class="spinner"></div>
    </div>

    <script>
        const out = document.getElementById('out');
        const splash = document.getElementById('splash');
        new MutationObserver(() => {
            if (!out.querySelector('canvas')) return;
            splash.classList.add('gone');
            setTimeout(() => splash.remove(), 300);
        }).observe(out, { childList: true, subtree: true });
    </script>
</body>

</html>
