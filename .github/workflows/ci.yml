name: CI

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FULL: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.base_ref == 'develop' || github.base_ref == 'main' || startsWith(github.ref, 'refs/tags/v') }}
      MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - run: dotnet restore Dialogix.slnx
      - run: dotnet format Dialogix.slnx --verify-no-changes --no-restore

      - if: env.FULL == 'true'
        run: dotnet build Dialogix.slnx -c Release --no-restore

      - if: env.FULL == 'true'
        run: dotnet test tests/Dialogix.Avalonia.Tests -c Release --no-build

      - if: env.MAIN == 'true'
        run: dotnet workload install wasm-tools

      - if: env.MAIN == 'true'
        run: dotnet publish demo/Dialogix.Avalonia.Demo.Browser/Dialogix.Avalonia.Demo.Browser.csproj -c Release -o demo-pub

      - if: env.MAIN == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-pub/wwwroot

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Compute version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE="$(dotnet msbuild src/Dialogix.Avalonia/Dialogix.Avalonia.csproj -getProperty:Version)"
            VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing $VERSION"

      - uses: NuGet/login@v1
        id: login
        with:
          user: daniel-skliphosovsky

      - run: dotnet pack src/Dialogix.Avalonia/Dialogix.Avalonia.csproj -c Release -o artifacts -p:Version="$VERSION" -p:PackageVersion="$VERSION"

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source https://nuget.pkg.github.com/daniel-skliphosovsky/index.json --skip-duplicate

      - if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
